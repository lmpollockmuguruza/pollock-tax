<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 8 116 116" role="img" aria-label="Pollock — US Expat Tax | Spain. Tax preparation and consulting.">
  <defs>
    <!-- Annulus: outer arc clockwise, inner arc counter-clockwise, so nonzero fill
         leaves the centre hole. Works in browsers and headless renderers alike. -->
    <clipPath id="ringClip">
      <path d="M8,66 a54,54 0 1,1 108,0 a54,54 0 1,1 -108,0 Z
               M26,66 a36,36 0 1,0 72,0 a36,36 0 1,0 -72,0 Z"/>
    </clipPath>
    <clipPath id="leftHalf"><rect x="6" y="10" width="54.5" height="112"/></clipPath>
    <clipPath id="rightHalf"><rect x="63.5" y="10" width="54.5" height="112"/></clipPath>
  </defs>

  <!-- Emblem: a ring, US flag on the left half, Spanish flag on the right half. -->
  <g clip-path="url(#ringClip)">
    <g clip-path="url(#leftHalf)">
      <rect x="6" y="12" width="112" height="108" fill="#ffffff"/>
      <g fill="#B31942">
        <rect x="6" y="12"     width="112" height="8.31"/>
        <rect x="6" y="28.62"  width="112" height="8.31"/>
        <rect x="6" y="45.24"  width="112" height="8.31"/>
        <rect x="6" y="61.85"  width="112" height="8.31"/>
        <rect x="6" y="78.46"  width="112" height="8.31"/>
        <rect x="6" y="95.08"  width="112" height="8.31"/>
        <rect x="6" y="111.69" width="112" height="8.31"/>
      </g>
      <rect x="6" y="12" width="50" height="46" fill="#0A3161"/>
      <g fill="#ffffff">
        <circle cx="14" cy="20" r="1.8"/><circle cx="26" cy="20" r="1.8"/><circle cx="38" cy="20" r="1.8"/><circle cx="50" cy="20" r="1.8"/>
        <circle cx="20" cy="29" r="1.8"/><circle cx="32" cy="29" r="1.8"/><circle cx="44" cy="29" r="1.8"/>
        <circle cx="14" cy="38" r="1.8"/><circle cx="26" cy="38" r="1.8"/><circle cx="38" cy="38" r="1.8"/><circle cx="50" cy="38" r="1.8"/>
        <circle cx="20" cy="47" r="1.8"/><circle cx="32" cy="47" r="1.8"/><circle cx="44" cy="47" r="1.8"/>
      </g>
    </g>
    <g clip-path="url(#rightHalf)">
      <rect x="6" y="12" width="112" height="108" fill="#AA151B"/>
      <rect x="6" y="39" width="112" height="54"  fill="#F1BF00"/>
    </g>
  </g>
</svg>
